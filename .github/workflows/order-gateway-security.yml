name: Order gateway security tests

on:
  pull_request:
    paths:
      - "api/orders.js"
      - "tools/order-gateway-contract-test.mjs"
      - "js/cart.js"
      - "js/services/order-service.js"
      - "security-order-gateway-preview.sql"
      - ".github/workflows/order-gateway-security.yml"
      - "tools/gateway-pg-fixture.sql"
      - "tools/gateway-pg-assertions.sql"
      - "tools/admin-authorization-pg-assertions.sql"
      - "security-reviews-blocked-users-preview.sql"
      - "tools/reviews-blocked-pg-assertions.sql"
      - "security-admin-mfa-preview.sql"
      - "tools/admin-mfa-pg-assertions.sql"
      - "js/admin-mfa.js"
      - "js/services/admin-mfa-service.js"
      - "tools/admin-mfa-ui-test.mjs"
      - "js/admin.js"
      - "js/auth.js"
      - "js/modal.js"
      - "js/app.js"
      - "index.html"
      - "css/admin-mfa.css"
      - "tools/security-baseline-test.mjs"
      - "tools/admin-mfa-controller-test.mjs"
      - "security-waf-rate-limit-candidate.json"
      - "tools/waf-proposal-test.mjs"
      - "vercel.json"
      - "js/config.js"
  push:
    branches: ["security/preview-order-spam-gateway-20261120"]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate JavaScript syntax
        run: |
          node --check api/orders.js
          node --check js/cart.js
          node --check js/catalog.js
          node --check js/services/product-service.js
          node --check js/services/order-service.js
          node --check tools/order-gateway-contract-test.mjs
          node --check js/admin.js
          node --check js/admin-mfa.js
          node --check js/services/admin-mfa-service.js
          node --check js/auth.js
          node --check js/modal.js
          node --check js/app.js
          node --check tools/admin-mfa-ui-test.mjs
          node --check tools/security-baseline-test.mjs
          node --check tools/admin-mfa-controller-test.mjs
          node --check tools/waf-proposal-test.mjs
      - name: Run isolated gateway contract tests
        run: node --test tools/order-gateway-contract-test.mjs
      - name: Verify preview isolation and no WhatsApp handoff
        run: node --test tools/preview-isolation-test.mjs
      - name: Verify MFA enrollment, AAL2, and admin UI wiring
        run: node --test tools/admin-mfa-ui-test.mjs
      - name: Regression-test real MFA controller against stale session races
        run: node --test tools/admin-mfa-controller-test.mjs
      - name: Scan public assets for secret leaks and validate security headers
        run: node --test tools/security-baseline-test.mjs
      - name: Verify WAF rate-limit proposal cannot touch production
        run: node --test tools/waf-proposal-test.mjs

  postgres-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-test-password
          POSTGRES_DB: gateway_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gateway_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: synthetic-test-password
      PGDATABASE: gateway_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare synthetic database
        run: psql -X -v ON_ERROR_STOP=1 -f tools/gateway-pg-fixture.sql
      - name: Execute staged migration on disposable PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f security-order-gateway-preview.sql
      - name: Assert function permissions and customer identity context
        run: psql -X -v ON_ERROR_STOP=1 -f tools/gateway-pg-assertions.sql
      - name: Assert synthetic admin, customer, and blocked-role boundaries
        run: psql -X -v ON_ERROR_STOP=1 -f tools/admin-authorization-pg-assertions.sql
      - name: Assert review RLS blocks banned accounts at database layer
        run: psql -X -v ON_ERROR_STOP=1 -f tools/reviews-blocked-pg-assertions.sql
      - name: Assert staged admin MFA needs AAL2 and role authorization
        run: psql -X -v ON_ERROR_STOP=1 -f tools/admin-mfa-pg-assertions.sql
